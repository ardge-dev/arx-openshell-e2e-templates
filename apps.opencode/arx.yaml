apiVersion: arx.ardge.com/v1
kind: ArxBinding
spec:
  # The operator delivers this binding through an OpenShell provider: the
  # sandbox sees ARX_LLM_BASE_URL as is and ARX_LLM_API_KEY only as a
  # placeholder the supervisor resolves on requests to the llm-gateway.
  ai:
    inject:
      baseUrl: ARX_LLM_BASE_URL
      apiKey: ARX_LLM_API_KEY
    # The model instance the user picked for the manifest's llm slot.
    models:
      - name: llm
        inject: ARX_LLM_MODEL

  # Ports are loopback ports inside the sandbox. The operator registers each
  # one with the OpenShell gateway and runs a proxy behind the NodePort, so
  # no sandbox port is reachable without being listed here.
  network:
    services:
      http:
        type: NodePort
        ports:
          # opencode serve: web UI and API.
          - name: ui
            port: 4096
          # Free port for services the agent starts itself, e.g. a preview
          # server for the code it writes.
          - name: preview
            port: 8000

  desktop:
    shortcuts:
      - label: OpenCode
        open:
          - newtab
        serviceRef: http
        portRef: ui
        scheme: http
        path: /
